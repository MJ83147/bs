<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elimination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #E6ECE9;
      --paper: #FFFFFF;
      --ink: #15211B;
      --muted: #5E6E66;
      --rule: #C9D3CE;
      --accent: #1E7360;
      --accent-ink: #FFFFFF;
      --win: #1E7360;
      --loss: #B2372E;
      --soft: #F3F6F4;
      --track: #E7EDEA;
    }

    :root[data-theme="dark"] {
      --bg: #10150F;
      --paper: #19201B;
      --ink: #C4CEC8;
      --muted: #7E8E85;
      --rule: #2C3630;
      --accent: #35A98C;
      --accent-ink: #06120C;
      --win: #35A98C;
      --loss: #E27469;
      --soft: #212A24;
      --track: #232D26;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }

    body {
      font-family: 'Schibsted Grotesk', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; color: inherit; cursor: pointer; }

    header { padding: 28px 40px 0; }

    .top {
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 16px;
    }

    .brand {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      margin: 0;
    }

    .updated { color: var(--muted); font-size: 13px; }

    .updated .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--win);
      margin-right: 5px;
      vertical-align: middle;
    }

    .spacer { flex: 1; }

    .iconbtn {
      background: none;
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .iconbtn:hover { color: var(--ink); }

    .seg {
      display: inline-flex;
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
    }

    .seg button {
      background: none;
      border: 0;
      padding: 6px 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .seg button + button { border-left: 1px solid var(--rule); }
    .seg button.on { background: var(--accent); color: var(--accent-ink); }

    main { padding: 28px 40px 80px; }

    .lbl {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px;
    }

    section { margin-bottom: 40px; }

    /* Hero: combined score-over-time line chart, one line per team */
    .hero {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 18px 20px 16px;
    }

    .hero canvas { width: 100%; height: 360px; display: block; }

    .legend2 {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-top: 14px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      background: none;
      border: 0;
      padding: 2px 4px;
      border-radius: 6px;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }

    .chip .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
    .chip.off { opacity: 0.35; }
    .chip .cv { color: var(--muted); font-weight: 700; }

    .tip {
      position: fixed;
      pointer-events: none;
      background: var(--paper);
      border: 1px solid var(--rule);
      color: var(--ink);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      z-index: 30;
      opacity: 0;
      transition: opacity .08s;
      box-shadow: 0 6px 24px rgba(0,0,0,.18);
      max-width: 240px;
    }

    .tip .tt { color: var(--muted); margin-bottom: 4px; }
    .tip .tr { display: flex; align-items: center; gap: 7px; }
    .tip .tr .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
    .tip .tr .tn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tip .tr .tv { font-weight: 700; }

    /* Top: per-team wins/losses bar charts */
    .wlgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 14px 16px;
      will-change: transform;
    }

    .card.elim { opacity: 0.5; }

    .chead {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chead .rk {
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 13px;
      min-width: 22px;
    }

    .chead .nm { font-weight: 700; letter-spacing: -0.01em; }

    .chead .sc {
      margin-left: auto;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .bar-row .k {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .track {
      background: var(--track);
      border-radius: 6px;
      height: 16px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0;
      border-radius: 6px;
      transition: width .7s cubic-bezier(.22,1,.36,1);
    }

    .bar.win { background: var(--win); }
    .bar.loss { background: var(--loss); }

    .bar-row .v {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 13px;
      min-width: 58px;
      text-align: right;
    }

    /* Bottom: three ranked tables */
    .tables {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .tbl {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 6px 6px 8px;
    }

    .tbl h3 {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 10px 12px 8px;
    }

    .trow {
      display: grid;
      grid-template-columns: 26px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-radius: 8px;
      will-change: transform;
    }

    .trow:nth-child(even) { background: var(--soft); }

    .trow .rk {
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      color: var(--muted);
      text-align: right;
      font-size: 13px;
    }

    .trow .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .trow .val {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      text-align: right;
    }

    /* Middle: per-team wins/losses over time */
    .legend {
      display: flex;
      gap: 16px;
      align-items: center;
      margin: -6px 0 16px;
      font-size: 12px;
      color: var(--muted);
    }

    .legend .sw {
      display: inline-block;
      width: 11px; height: 11px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .mgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .mcard {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .mcard .mh {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .mcard .mn { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
    .mcard .ml { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .mcard canvas { width: 100%; height: 84px; display: block; }

    .err { max-width: 460px; margin: 80px auto; text-align: center; color: var(--muted); }

    @media (max-width: 900px) {
      header { padding: 24px 20px 0; }
      main { padding: 22px 20px 60px; }
      .tables { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <div class="top">
      <h1 class="brand">Elimination</h1>
      <span class="updated" id="updated"></span>
      <span class="spacer"></span>
      <div class="seg" id="filterSeg">
        <button data-filter="all" class="on">All</button>
        <button data-filter="top6">Top 6</button>
        <button data-filter="bottom6">Bottom 6</button>
      </div>
      <button class="iconbtn" id="refreshBtn">Refresh</button>
      <button class="iconbtn" id="themeToggle">Theme</button>
    </div>
  </header>

  <main>
    <div id="err" class="err" hidden></div>

    <section id="s0" hidden>
      <p class="lbl">Score over time</p>
      <div class="hero">
        <canvas id="race"></canvas>
        <div class="legend2" id="legend"></div>
      </div>
    </section>

    <section id="s1" hidden>
      <p class="lbl">Wins vs losses, live</p>
      <div class="wlgrid" id="wlgrid"></div>
    </section>

    <section id="s1b" hidden>
      <p class="lbl">Wins &amp; losses over time</p>
      <div class="legend">
        <span><span class="sw" style="background:var(--win)"></span>Wins</span>
        <span><span class="sw" style="background:var(--loss)"></span>Losses</span>
      </div>
      <div class="mgrid" id="mgrid"></div>
    </section>

    <section id="s2" hidden>
      <div class="tables">
        <div class="tbl"><h3>Lives</h3><div class="tbody" id="tLives"></div></div>
        <div class="tbl"><h3>Wins</h3><div class="tbody" id="tWins"></div></div>
        <div class="tbl"><h3>Losses</h3><div class="tbody" id="tLosses"></div></div>
      </div>
    </section>
  </main>

  <div class="tip" id="tip"></div>

  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const fmt = n => Number(n || 0).toLocaleString('en-GB');
    const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      $('#themeToggle').textContent = t === 'dark' ? 'Light' : 'Dark';
    }
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(localStorage.getItem('elim-theme') || (prefersDark ? 'dark' : 'light'));
    $('#themeToggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('elim-theme', next);
      applyTheme(next);
    });

    let data = null;

    async function load() {
      try {
        const r = await fetch('/api/elimination');
        if (!r.ok) throw new Error('Request failed (' + r.status + ')');
        data = await r.json();
      } catch (e) {
        $('#err').textContent = 'Could not load standings. ' + e.message;
        $('#err').hidden = false;
        return;
      }
      $('#err').hidden = true;
      render();
    }

    function render() {
      if (!data || !data.teams.length) return;
      $('#s0').hidden = false;
      $('#s1').hidden = false;
      $('#s1b').hidden = false;
      $('#s2').hidden = false;

      const when = data.fetched_at ? new Date(data.fetched_at * 1000) : null;
      $('#updated').innerHTML = when
        ? '<span class="dot"></span>Updated ' + when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : '';

      // Stable colour and standings-rank for every team (by score), assigned from
      // the full field so they don't change when a Top/Bottom filter narrows it.
      const ids = data.teams.map(t => t.team_id).sort((a, b) => a - b);
      colorOf = {};
      ids.forEach((id, i) => colorOf[id] = PALETTE[i % PALETTE.length]);
      rankOf = {};
      data.teams.forEach((t, i) => rankOf[t.team_id] = i + 1);

      shown = applyFilter(data.teams);
      const history = data.history || {};

      renderRace(shown, history);
      renderBars(shown);
      renderTimeCharts(shown, history);
      const byLives = [...shown].sort((a, b) => b.lives - a.lives);
      const byWins = [...shown].sort((a, b) => b.wins - a.wins);
      const byLosses = [...shown].sort((a, b) => b.losses - a.losses);
      renderTable($('#tLives'), byLives, t => t.lives);
      renderTable($('#tWins'), byWins, t => t.wins);
      renderTable($('#tLosses'), byLosses, t => t.losses);
    }

    // Top/Bottom filter over the current standings (data.teams is score-ordered).
    function applyFilter(teams) {
      if (filter === 'top6') return teams.slice(0, 6);
      if (filter === 'bottom6') return teams.slice(-6);
      return teams;
    }

    // Top grid: teams in score order (rank), each a wins/losses bar pair.
    // Bars are scaled to the global max so lengths compare across teams, and
    // updated in place so widths transition (the "live movement").
    function renderBars(teams) {
      const grid = $('#wlgrid');
      const maxWL = Math.max(1, ...teams.map(t => Math.max(t.wins, t.losses)));
      const order = teams.map(t => t.team_id);

      const existing = {};
      grid.querySelectorAll('.card').forEach(el => existing[el.dataset.id] = el);
      const oldRects = {};
      for (const id in existing) oldRects[id] = existing[id].getBoundingClientRect();

      teams.forEach((t, i) => {
        let el = existing[t.team_id];
        if (!el) {
          el = document.createElement('div');
          el.className = 'card';
          el.dataset.id = t.team_id;
          el.innerHTML =
            '<div class="chead"><span class="rk"></span><span class="nm"></span><span class="sc"></span></div>' +
            '<div class="bar-row"><span class="k">Wins</span><div class="track"><div class="bar win"></div></div><span class="v vw"></span></div>' +
            '<div class="bar-row"><span class="k">Loss</span><div class="track"><div class="bar loss"></div></div><span class="v vl"></span></div>';
        }
        el.classList.toggle('elim', !!t.eliminated);
        $('.rk', el).textContent = '#' + (rankOf[t.team_id] || i + 1);
        $('.nm', el).textContent = t.name;
        $('.sc', el).textContent = fmt(t.score);
        $('.vw', el).textContent = fmt(t.wins);
        $('.vl', el).textContent = fmt(t.losses);
        $('.bar.win', el).style.width = (100 * t.wins / maxWL) + '%';
        $('.bar.loss', el).style.width = (100 * t.losses / maxWL) + '%';
        grid.appendChild(el); // reorder to rank order
      });

      // drop cards for teams no longer in the filtered set
      const keep = new Set(order.map(String));
      grid.querySelectorAll('.card').forEach(el => { if (!keep.has(el.dataset.id)) el.remove(); });

      flip(grid, '.card', oldRects);
    }

    function renderTable(body, teams, valueOf) {
      const existing = {};
      body.querySelectorAll('.trow').forEach(el => existing[el.dataset.id] = el);
      const oldRects = {};
      for (const id in existing) oldRects[id] = existing[id].getBoundingClientRect();

      teams.forEach((t, i) => {
        let el = existing[t.team_id];
        if (!el) {
          el = document.createElement('div');
          el.className = 'trow';
          el.dataset.id = t.team_id;
          el.innerHTML = '<span class="rk"></span><span class="nm"></span><span class="val"></span>';
        }
        $('.rk', el).textContent = i + 1;
        $('.nm', el).textContent = t.name;
        $('.val', el).textContent = fmt(valueOf(t));
        body.appendChild(el);
      });

      const keep = new Set(teams.map(t => String(t.team_id)));
      body.querySelectorAll('.trow').forEach(el => { if (!keep.has(el.dataset.id)) el.remove(); });

      flip(body, '.trow', oldRects);
    }

    // Animate rows/cards from their previous positions to the new order.
    function flip(container, sel, oldRects) {
      container.querySelectorAll(sel).forEach(el => {
        const o = oldRects[el.dataset.id];
        if (!o) return;
        const dy = o.top - el.getBoundingClientRect().top;
        if (!dy) return;
        el.animate(
          [{ transform: 'translateY(' + dy + 'px)' }, { transform: 'translateY(0)' }],
          { duration: 450, easing: 'cubic-bezier(.22,1,.36,1)' });
      });
    }

    const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

    // Combined score-over-time chart: one line per team. Colour follows the team
    // (assigned by stable team_id order), never its rank, so a line keeps its
    // colour as teams reorder. Legend chips toggle lines; hover shows a crosshair
    // with every visible team's score at that moment.
    const PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#e34948', '#9085e9', '#e87ba4',
      '#b6992d', '#76b7b2', '#b07aa1', '#59a14f', '#f28e8c', '#9c755f'];
    const hidden = new Set();
    let colorOf = {};
    let rankOf = {};
    let filter = 'all';
    let shown = [];
    let raceGeo = null;

    function renderRace(teams, history) {
      drawRace(teams, history);
      renderLegend(teams);
    }

    function renderLegend(teams) {
      const box = $('#legend');
      box.innerHTML = '';
      // legend in current standings (score) order
      teams.forEach(t => {
        const chip = document.createElement('button');
        chip.className = 'chip' + (hidden.has(t.team_id) ? ' off' : '');
        chip.innerHTML = '<span class="sw" style="background:' + colorOf[t.team_id] + '"></span>' +
          esc(t.name) + ' <span class="cv">' + fmt(t.score) + '</span>';
        chip.addEventListener('click', () => {
          if (hidden.has(t.team_id)) hidden.delete(t.team_id); else hidden.add(t.team_id);
          drawRace(shown, data.history || {});
          renderLegend(shown);
        });
        box.appendChild(chip);
      });
    }

    function drawRace(teams, history) {
      const canvas = $('#race');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      canvas.width = W * dpr; canvas.height = H * dpr;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      const padL = 52, padR = 14, padT = 12, padB = 24;
      const plotW = W - padL - padR, plotH = H - padT - padB;

      const vis = teams.filter(t => !hidden.has(t.team_id));
      const seriesOf = t => (history[t.team_id] && history[t.team_id].points) || [];
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const t of vis) for (const p of seriesOf(t)) {
        if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
        if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
      }
      if (!isFinite(x0)) {
        ctx.fillStyle = css('--muted');
        ctx.font = '13px "Schibsted Grotesk", system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('Collecting history… lines appear as snapshots build up.', W / 2, H / 2);
        raceGeo = null;
        return;
      }
      if (x1 === x0) x1 = x0 + 1;
      const span = (y1 - y0) * 0.08 || 1;
      y0 -= span; y1 += span;
      if (y1 === y0) y1 = y0 + 1;

      const X = t => padL + (t - x0) / (x1 - x0) * plotW;
      const Y = v => padT + plotH - (v - y0) / (y1 - y0) * plotH;

      // grid + axes
      ctx.strokeStyle = css('--rule');
      ctx.fillStyle = css('--muted');
      ctx.lineWidth = 1;
      ctx.font = '11px "Schibsted Grotesk", system-ui, sans-serif';
      ctx.textBaseline = 'middle';
      for (let i = 0; i <= 4; i++) {
        const v = y0 + (y1 - y0) * i / 4, y = Y(v);
        ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.textAlign = 'right';
        ctx.fillText(fmt(Math.round(v)), padL - 8, y);
      }
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (let i = 0; i <= 4; i++) {
        const t = x0 + (x1 - x0) * i / 4;
        ctx.fillText(new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), X(t), H - padB + 6);
      }

      for (const t of vis) {
        const pts = seriesOf(t);
        if (!pts.length) continue;
        ctx.beginPath();
        pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        ctx.strokeStyle = colorOf[t.team_id];
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.stroke();
        const last = pts[pts.length - 1];
        ctx.beginPath(); ctx.arc(X(last[0]), Y(last[1]), 3, 0, Math.PI * 2);
        ctx.fillStyle = colorOf[t.team_id]; ctx.fill();
      }

      raceGeo = { X, Y, x0, x1, padL, padR, padT, plotW, plotH, W, H };
      attachRaceHover();
    }

    function attachRaceHover() {
      const canvas = $('#race');
      const tip = $('#tip');
      canvas.onmousemove = e => {
        if (!raceGeo) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        if (mx < raceGeo.padL || mx > raceGeo.W - raceGeo.padR) { tip.style.opacity = '0'; return; }
        // target time from x, snap to nearest available ts using any series
        const frac = (mx - raceGeo.padL) / raceGeo.plotW;
        const target = raceGeo.x0 + frac * (raceGeo.x1 - raceGeo.x0);

        drawRace(shown, data.history || {});
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const gx = raceGeo.X(target);
        ctx.strokeStyle = css('--muted'); ctx.globalAlpha = 0.5;
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(gx, raceGeo.padT); ctx.lineTo(gx, raceGeo.padT + raceGeo.plotH); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = 1;

        const rows = [];
        for (const t of shown) {
          if (hidden.has(t.team_id)) continue;
          const pts = (data.history[t.team_id] && data.history[t.team_id].points) || [];
          if (!pts.length) continue;
          let best = pts[0];
          for (const p of pts) if (Math.abs(p[0] - target) < Math.abs(best[0] - target)) best = p;
          rows.push({ name: t.name, id: t.team_id, v: best[1], ts: best[0] });
          ctx.beginPath(); ctx.arc(raceGeo.X(best[0]), raceGeo.Y(best[1]), 3.5, 0, Math.PI * 2);
          ctx.fillStyle = colorOf[t.team_id]; ctx.fill();
          ctx.strokeStyle = css('--paper'); ctx.lineWidth = 1.5; ctx.stroke();
        }
        if (!rows.length) { tip.style.opacity = '0'; return; }
        rows.sort((a, b) => b.v - a.v);
        const when = new Date(rows[0].ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        tip.innerHTML = '<div class="tt">' + when + '</div>' + rows.map(r =>
          '<div class="tr"><span class="sw" style="background:' + colorOf[r.id] + '"></span>' +
          '<span class="tn">' + esc(r.name) + '</span><span class="tv">' + fmt(r.v) + '</span></div>').join('');
        tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 250) + 'px';
        tip.style.top = Math.min(e.clientY + 8, window.innerHeight - rows.length * 18 - 40) + 'px';
        tip.style.opacity = '1';
      };
      canvas.onmouseleave = () => { $('#tip').style.opacity = '0'; drawRace(shown, data.history || {}); };
    }

    // Middle grid: teams in score order, each a two-line chart of wins and
    // losses over the stored window. Rebuilt each refresh; canvases redraw.
    function renderTimeCharts(teams, history) {
      const grid = $('#mgrid');
      grid.innerHTML = '';
      teams.forEach(t => {
        const pts = (history[t.team_id] && history[t.team_id].points) || [];
        const card = document.createElement('div');
        card.className = 'mcard';
        card.innerHTML =
          '<div class="mh"><span class="mn">' + esc(t.name) + '</span>' +
          '<span class="ml">' + fmt(t.wins) + ' W · ' + fmt(t.losses) + ' L</span></div>' +
          '<canvas></canvas>';
        grid.appendChild(card);
        drawDual(card.querySelector('canvas'), pts);
      });
    }

    // Two lines over time: wins (index 3) and losses (index 4). Shared y-scale.
    function drawDual(canvas, pts) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      canvas.width = W * dpr; canvas.height = H * dpr;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      const pad = 4;
      const plotW = W - pad * 2, plotH = H - pad * 2;
      if (pts.length < 1) {
        ctx.fillStyle = css('--muted');
        ctx.font = '11px "Schibsted Grotesk", system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('collecting…', W / 2, H / 2);
        return;
      }

      const xs = pts.map(p => p[0]);
      let x0 = Math.min(...xs), x1 = Math.max(...xs);
      if (x1 === x0) x1 = x0 + 1;
      const vals = pts.flatMap(p => [p[3], p[4]]);
      let y0 = Math.min(...vals), y1 = Math.max(...vals);
      const span = (y1 - y0) * 0.1 || 1;
      y0 -= span; y1 += span;
      if (y1 === y0) y1 = y0 + 1;

      const X = t => pad + (t - x0) / (x1 - x0) * plotW;
      const Y = v => pad + plotH - (v - y0) / (y1 - y0) * plotH;

      const line = (idx, color) => {
        ctx.beginPath();
        pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[idx]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.8;
        ctx.lineJoin = 'round';
        ctx.stroke();
        const last = pts[pts.length - 1];
        ctx.beginPath(); ctx.arc(X(last[0]), Y(last[idx]), 2.4, 0, Math.PI * 2);
        ctx.fillStyle = color; ctx.fill();
      };
      line(3, css('--win'));
      line(4, css('--loss'));
    }

    // Redraw canvases (which use CSS-var colors) when the theme flips.
    $('#themeToggle').addEventListener('click', () => { if (data) render(); });

    window.addEventListener('resize', () => { if (data) render(); });

    $('#filterSeg').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      filter = b.dataset.filter;
      $('#filterSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      if (data) render();
    });

    $('#refreshBtn').addEventListener('click', load);
    load();
    setInterval(load, 20000);
  </script>
</body>

</html>
