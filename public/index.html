<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brain Surgeons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #E6ECE9;
      --paper: #FFFFFF;
      --ink: #15211B;
      --muted: #5E6E66;
      --rule: #C9D3CE;
      --accent: #1E7360;
      --accent-ink: #FFFFFF;
      --warn: #B2372E;
      --soft: #F3F6F4;
      --c-open: #C8871E;
      --c-approved: #2F6DB0;
    }

    :root[data-theme="dark"] {
      --bg: #10150F;
      --paper: #19201B;
      --ink: #C4CEC8;
      --muted: #7E8E85;
      --rule: #2C3630;
      --accent: #35A98C;
      --accent-ink: #06120C;
      --warn: #E27469;
      --soft: #212A24;
      --c-open: #E0A94A;
      --c-approved: #5B9BD8;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
    }

    body {
      font-family: 'Schibsted Grotesk', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      color: var(--ink);
      background: var(--bg);
    }

    table,
    .stat b {
      font-variant-numeric: tabular-nums;
    }

    a {
      color: inherit;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      padding: 28px 40px 0;
      max-width: 1440px;
      margin: 0 auto;
    }

    .brand {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      margin: 0 0 18px;
    }

    nav {
      display: flex;
      gap: 26px;
      border-bottom: 1px solid var(--rule);
    }

    nav a {
      text-decoration: none;
      padding: 0 0 12px;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
    }

    nav a.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    nav .spacer {
      flex: 1;
    }

    nav button {
      background: none;
      border: 0;
      color: var(--muted);
      padding: 0 0 12px;
    }

    nav button.icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 0 12px;
    }

    nav button.icon-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    nav button.icon-btn:hover {
      color: var(--ink);
    }

    main {
      padding: 32px 40px 80px;
      max-width: 1440px;
      margin: 0 auto;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 16px;
      letter-spacing: -0.01em;
    }

    section {
      margin-top: 52px;
    }

    .page-desc {
      color: var(--muted);
      margin: -10px 0 28px;
      max-width: 780px;
    }

    .section-desc {
      color: var(--muted);
      margin: -8px 0 18px;
      max-width: 780px;
    }

    .stats {
      display: flex;
      gap: 56px;
      margin: 24px 0 40px;
      flex-wrap: wrap;
    }

    .stat b {
      display: block;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .stat span {
      color: var(--muted);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 18px 20px;
    }

    .card.off {
      opacity: .55;
    }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 14px;
    }

    .card-head b {
      font-size: 17px;
      font-weight: 700;
    }

    .card-head .id {
      color: var(--muted);
      font-size: 13px;
    }

    .card .kpis {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 28px;
      margin: 0 0 14px;
    }

    .card .kpi {
      flex: 0 0 auto;
    }

    .card .kpi b {
      display: block;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .card .kpi span {
      color: var(--muted);
      font-size: 13px;
    }

    .card .big {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .card .big+.lbl {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    ul.items {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    ul.items li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      border-top: 1px solid var(--rule);
      font-size: 14px;
    }

    ul.items li:first-child {
      border-top: 0;
    }

    ul.items li span.n {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    ul.items li.more {
      color: var(--muted);
      justify-content: flex-start;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      margin-right: 7px;
      vertical-align: middle;
    }

    .dot.high {
      background: var(--accent);
    }

    .dot.low {
      background: var(--warn);
    }

    .bar {
      height: 8px;
      background: var(--soft);
      border-radius: 999px;
      overflow: hidden;
      margin: 4px 0 10px;
    }

    .bar>span {
      display: block;
      height: 100%;
    }

    .bar>span.high {
      background: var(--accent);
    }

    .bar>span.low {
      background: var(--warn);
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .badge.high {
      background: var(--accent);
    }

    .badge.low {
      background: var(--warn);
    }

    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-content: start;
      margin-bottom: 34px;
    }

    @media (max-width: 720px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 16px 20px 18px;
    }

    .chart h3 {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 2px;
    }

    .chart .sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 14px;
    }

    .chart svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 160px;
      overflow: visible;
    }

    .chart .axis {
      fill: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .chart .val {
      fill: var(--ink);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .chart .lbl {
      fill: var(--ink);
      font-size: 12.5px;
    }

    .chart .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 12px 0;
    }

    .heat-cell {
      stroke: var(--paper);
      stroke-width: 2;
      rx: 2;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-top: 12px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .legend i {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex: 0 0 auto;
    }

    .legend b {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .hbars {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hbar-row {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .hbar-row .lbl {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hbar-row .track {
      height: 10px;
      background: var(--soft);
      border-radius: 999px;
      overflow: hidden;
    }

    .hbar-row .track > span {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    .hbar-row .n {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 28px;
      text-align: right;
    }

    .sbar {
      display: flex;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      gap: 2px;
      background: var(--soft);
    }

    .sbar > span {
      display: block;
      min-width: 3px;
    }

    .heat {
      display: grid;
      grid-template-columns: 30px repeat(24, minmax(0, 1fr));
      gap: 2px;
      align-items: center;
    }

    .heat .hx {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .heat .hy {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      padding-right: 6px;
    }

    .heat .cell {
      aspect-ratio: 1 / 1;
      border-radius: 2px;
      background: var(--soft);
    }

    .table-wrap {
      max-height: 72vh;
      overflow: auto;
      border: 1px solid var(--rule);
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--paper);
    }

    th,
    td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--rule);
      vertical-align: top;
    }

    th {
      font-weight: 500;
      color: var(--muted);
      position: sticky;
      top: 0;
      background: var(--paper);
      box-shadow: inset 0 -1px 0 var(--rule);
      z-index: 1;
    }

    td.n,
    th.n {
      text-align: right;
    }

    tr.declined td,
    tr.transfer td {
      color: var(--muted);
    }

    td .warn {
      color: var(--warn);
    }

    td .ok {
      color: var(--accent);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin: 0 0 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .subtabs {
      display: flex;
      gap: 4px;
      margin: 28px 0 24px;
      border-bottom: 1px solid var(--rule);
      flex-wrap: wrap;
    }

    .subtab {
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 10px 16px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: -1px;
    }

    .subtab.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    input,
    select {
      padding: 8px 10px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--paper);
    }

    .ac {
      position: relative;
      display: inline-block;
    }

    .ac-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 20;
      margin-top: 2px;
      max-height: 240px;
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 4px;
    }

    .ac-list div {
      padding: 6px 10px;
      cursor: pointer;
    }

    .ac-list div:hover,
    .ac-list div.sel {
      background: var(--accent);
      color: var(--accent-ink);
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .primary {
      background: var(--accent);
      color: var(--accent-ink);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 8px 14px;
      font-weight: 500;
      text-decoration: none;
      display: inline-block;
    }

    button.quiet {
      background: none;
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 4px 10px;
    }

    button.quiet.warn {
      color: var(--warn);
      border-color: var(--warn);
    }

    form.grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 10px 16px;
      max-width: 700px;
      align-items: center;
    }

    form.grid label {
      color: var(--muted);
    }

    .msg {
      color: var(--warn);
      margin: 10px 0 0;
      min-height: 1.4em;
    }

    .msg.ok {
      color: var(--accent);
    }

    tfoot td {
      border-bottom: 0;
      background: var(--soft);
    }

    tfoot input {
      width: 100%;
    }

    #login {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    #login form {
      display: grid;
      gap: 12px;
      width: 280px;
    }

    #login .brand {
      margin-bottom: 8px;
    }

    @media (max-width: 720px) {

      header,
      main {
        padding-left: 16px;
        padding-right: 16px;
      }

      .brand {
        font-size: 26px;
      }

      nav {
        gap: 16px;
        overflow-x: auto;
      }

      form.grid {
        grid-template-columns: 1fr;
      }

      .stats {
        gap: 24px;
      }

      .dash-grid {
        grid-template-columns: 1fr;
      }

      th,
      td {
        padding: 8px;
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      nav a {
        transition: border-color .15s;
      }
    }
  </style>
</head>

<body>
  <div id="login" hidden>
    <form id="loginForm">
      <div class="brand">Brain Surgeons</div>
      <input type="password" id="pw" autocomplete="current-password" autofocus>
      <button class="primary" type="submit">Log in</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>

  <div id="app" hidden>
    <header>
      <div class="brand">Brain Surgeons</div>
      <nav>
        <a href="#dashboard" data-page="dashboard">Dashboard</a>
        <a href="#bankers" data-page="bankers">Bankers</a>
        <a href="#categories" data-page="categories">Categories</a>
        <a href="#ledger" data-page="ledger">Ledger</a>
        <a href="#requests" data-page="requests">Requests</a>
        <a href="#funds" data-page="funds">Register</a>
        <a href="#totals" data-page="totals">Totals</a>
        <a href="#team" data-page="team">Team status</a>
        <a href="#search" data-page="search">Search</a>
        <a href="#risk" data-page="risk">Risk</a>
        <a href="#settings" data-page="settings">Settings</a>
        <span class="spacer"></span>
        <button id="themeToggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
        <button id="logout">Log out</button>
      </nav>
    </header>
    <main id="main"></main>
  </div>

  <script>
    const $ = (s, r = document) => r.querySelector(s);

    const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>';
    const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
    const applyTheme = t => {
      document.documentElement.dataset.theme = t;
      const btn = document.getElementById('themeToggle');
      if (btn) btn.innerHTML = t === 'dark' ? SUN : MOON;
    };
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(localStorage.getItem('theme') || (prefersDark ? 'dark' : 'light'));
    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    const fmt = n => Number(n || 0).toLocaleString('en-GB');
    const money = n => '$' + fmt(n);
    const when = ts => { const d = new Date(ts * 1000); return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); };
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const CAT_LABELS = { xanax: 'Xanax', otherdrugs: 'Other drugs', ecans: 'Ecans', med: 'Med kits', fhc: 'FHCs', temps: 'Temps', wrongblood: 'Wrong blood bag / ipecac' };
    const reqItem = r => `${fmt(r.qty)} x ${esc(r.item_name || CAT_LABELS[r.category] || r.category || '')}`;

    async function api(path, opts = {}) {
      const r = await fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
      if (r.status === 401) { showLogin(); throw new Error('unauthorised'); }
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.statusText);
      return data;
    }

    function showLogin() { $('#login').hidden = false; $('#app').hidden = true; }
    function showApp() { $('#login').hidden = true; $('#app').hidden = false; route(); }

    $('#loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
      if (r.ok) { $('#pw').value = ''; showApp(); } else { $('#loginMsg').textContent = 'Wrong password'; $('#pw').value = ''; }
    });
    $('#logout').addEventListener('click', async () => { await fetch('/api/logout'); showLogin(); });

    const pages = {};
    function route() {
      // Hash routing drives the SPA; the bare /team path is a shareable entry
      // point that opens the same page.
      let page = (location.hash || '').slice(1);
      if (!page && location.pathname === '/team') page = 'team';
      page = page || 'dashboard';
      document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
      (pages[page] || pages.dashboard)();
    }
    window.addEventListener('hashchange', route);

    function head(title, desc) {
      return `<h2>${esc(title)}</h2><p class="page-desc">${esc(desc)}</p>`;
    }

    function table(cols, rows, foot = '') {
      const head = cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.h}</th>`).join('');
      const body = rows.map(r => `<tr class="${r._cls || ''}">${cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f(r)}</td>`).join('')}</tr>`).join('');
      return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot ? `<tfoot>${foot}</tfoot>` : ''}</table></div>`;
    }

    // --- Dashboard charts. Crisp HTML/CSS for bars, heatmap and the status bar;
    // SVG only for the time series. Empty states are handled by each builder. ---
    function chartCard(title, sub, body) {
      return `<div class="chart"><h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p>${body}</div>`;
    }

    // Horizontal bars, biggest first. data: [{ label, n }].
    function hbars(data) {
      if (!data.length) return `<p class="empty">No requests yet.</p>`;
      const max = Math.max(...data.map(d => d.n)) || 1;
      return `<div class="hbars">${data.map(d => `
        <div class="hbar-row" title="${esc(d.label)}: ${fmt(d.n)}">
          <span class="lbl">${esc(d.label)}</span>
          <span class="track"><span style="width:${Math.max(2, Math.round(d.n / max * 100))}%"></span></span>
          <span class="n">${fmt(d.n)}</span>
        </div>`).join('')}</div>`;
    }

    // 7x24 request-count grid, coloured by a single-hue sequential ramp (accent into soft).
    function heat(grid) {
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const max = Math.max(1, ...grid.flat());
      const total = grid.flat().reduce((s, n) => s + n, 0);
      if (!total) return `<p class="empty">No requests yet.</p>`;
      const cell = (n, day, hour) => {
        const pct = n ? 18 + Math.round(n / max * 82) : 0;
        const bg = n ? `background:color-mix(in srgb, var(--accent) ${pct}%, var(--soft))` : '';
        return `<div class="cell" style="${bg}" title="${day} ${String(hour).padStart(2, '0')}:00 TCT — ${fmt(n)} request${n === 1 ? '' : 's'}"></div>`;
      };
      const hourAxis = ['<div></div>', ...Array.from({ length: 24 }, (_, h) => `<div class="hx">${h % 6 === 0 ? h : ''}</div>`)].join('');
      const rows = grid.map((row, dow) => `<div class="hy">${days[dow]}</div>${row.map((n, h) => cell(n, days[dow], h)).join('')}`).join('');
      return `<div class="heat">${hourAxis}${rows}</div>`;
    }

    // Request volume over time as an SVG area+line. points: [{ day, n }].
    function timeSeries(points) {
      const total = points.reduce((s, p) => s + p.n, 0);
      if (!total) return `<p class="empty">No requests in this window.</p>`;
      const W = 700, H = 170, padL = 28, padR = 8, padT = 12, padB = 22;
      const max = Math.max(1, ...points.map(p => p.n));
      const n = points.length;
      const x = i => padL + (n <= 1 ? 0 : i / (n - 1) * (W - padL - padR));
      const y = v => padT + (1 - v / max) * (H - padT - padB);
      const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.n).toFixed(1)}`).join(' ');
      const area = `${line} L${x(n - 1).toFixed(1)} ${(H - padB).toFixed(1)} L${x(0).toFixed(1)} ${(H - padB).toFixed(1)} Z`;
      const ticks = [0, Math.round(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
      const gy = ticks.map(v => `<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W - padR}" y2="${y(v).toFixed(1)}" stroke="var(--rule)" stroke-width="1"/><text class="axis" x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
      const mo = d => new Date(d * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      const xlabels = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i).map(i => `<text class="axis" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${mo(points[i].day)}</text>`).join('');
      const dots = points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.n).toFixed(1)}" r="6" fill="transparent"><title>${mo(p.day)} — ${fmt(p.n)} request${p.n === 1 ? '' : 's'}</title></circle>`).join('');
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Requests per day">
        ${gy}
        <path d="${area}" fill="color-mix(in srgb, var(--accent) 14%, transparent)"/>
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${xlabels}${dots}
      </svg>`;
    }

    // Status breakdown as a single stacked bar with a labelled legend.
    const STATUS_META = [
      { key: 'fulfilled', label: 'Fulfilled', color: 'var(--accent)' },
      { key: 'approved', label: 'Pending send', color: 'var(--c-approved)' },
      { key: 'open', label: 'Open', color: 'var(--c-open)' },
      { key: 'declined', label: 'Declined', color: 'var(--warn)' },
      { key: 'cancelled', label: 'Cancelled', color: 'var(--muted)' },
    ];
    function statusBar(status) {
      const items = STATUS_META.map(m => ({ ...m, n: status[m.key] || 0 }));
      const total = items.reduce((s, it) => s + it.n, 0);
      if (!total) return `<p class="empty">No requests yet.</p>`;
      const segs = items.filter(it => it.n).map(it => `<span style="flex:${it.n};background:${it.color}" title="${it.label}: ${fmt(it.n)}"></span>`).join('');
      const legend = items.map(it => `<span><i style="background:${it.color}"></i>${it.label} <b>${fmt(it.n)}</b></span>`).join('');
      return `<div class="sbar">${segs}</div><div class="legend">${legend}</div>`;
    }

      <p class="section-desc">What each member has been sent, broken down by item.</p>
      ${table([
        { h: 'Member', f: r => `${esc(r.counterparty_name)} [${r.counterparty_id}]` },
        { h: 'Item', f: r => esc(r.item || 'cash') },
        { h: 'Qty', n: 1, f: r => fmt(r.qty) },
        { h: 'Value', n: 1, f: r => money(r.value) },
      ], t.members)}
    </section>`;
    };

    pages.team = async () => {
      const { rows, fetched_at } = await api('/team-status');
      const SDOT = { green: 'var(--accent)', blue: 'var(--c-approved)', red: 'var(--warn)' };
      // Column set. `sort` is the key used when the header is clicked; `num` right-aligns.
      const cols = [
        { h: 'Member', sort: r => (r.name || '').toLowerCase(), f: r => `<a href="https://www.torn.com/profiles.php?XID=${r.id}" target="_blank" rel="noopener">${esc(r.name)}</a> <span style="color:var(--muted)">[${r.id}]</span>` },
        { h: 'Attacks', num: 1, sort: r => r.attacks || 0, f: r => fmt(r.attacks || 0) },
        { h: 'Score', num: 1, sort: r => r.score || 0, f: r => fmt(r.score || 0) },
        { h: 'Level', num: 1, sort: r => r.level, f: r => fmt(r.level) },
        { h: 'Age', num: 1, sort: r => r.age || 0, f: r => fmt(r.age || 0) },
        { h: 'Revivable', sort: r => (r.revivable ? 1 : 0), f: r => r.revivable ? '<span class="ok">Yes</span>' : 'No' },
        { h: 'Faction', sort: r => (r.faction || '').toLowerCase(), f: r => esc(r.faction) },
        { h: 'Status', sort: r => (r.state || '').toLowerCase(), f: r => `<span class="dot" style="background:${SDOT[r.color] || 'var(--muted)'}"></span><span title="${esc(r.sdetails)}">${esc(r.sdesc || r.state)}</span>` },
        { h: 'Last action', sort: r => -(r.act_ts || 0), f: r => `${esc(r.act)}<span style="color:var(--muted)"> · ${esc(r.rel)}</span>` },
        { h: 'Net worth', num: 1, sort: r => r.networth, f: r => money(r.networth) },
      ];
      // Default to most attacks first, the score that matters for the elimination.
      const state = { q: '', status: '', act: '', si: 1, dir: -1 };
      const statuses = [...new Set(rows.map(r => r.state))].sort();

      const render = () => {
        const q = state.q.toLowerCase();
        let out = rows.filter(r =>
          (!state.status || r.state === state.status) &&
          (!state.act || r.act === state.act) &&
          (!q || r.name.toLowerCase().includes(q) || String(r.id).includes(q) || (r.faction || '').toLowerCase().includes(q)));
        const col = cols[state.si];
        out = out.map(r => [col.sort(r), r]).sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0) * state.dir).map(p => p[1]);
        const th = cols.map((c, i) => `<th class="${c.num ? 'n' : ''}" data-si="${i}" style="cursor:pointer">${c.h}${i === state.si ? (state.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');
        const body = out.map(r => `<tr>${cols.map(c => `<td class="${c.num ? 'n' : ''}">${c.f(r)}</td>`).join('')}</tr>`).join('');
        $('#teamCount').textContent = `Showing ${fmt(out.length)} of ${fmt(rows.length)}`;
        $('#teamTable').innerHTML = `<div class="table-wrap"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
        $('#teamTable').querySelectorAll('th[data-si]').forEach(h => h.addEventListener('click', () => {
          const i = Number(h.dataset.si);
          if (i === state.si) state.dir = -state.dir; else { state.si = i; state.dir = 1; }
          render();
        }));
      };

      $('#main').innerHTML = `
    ${head('Team status', `Every player on the Brain Surgeons elimination team with their competition attacks and score, plus level, faction, current Torn status, last action, and net worth. Sorted by attacks by default; click any column to re-sort, or search by name, ID, or faction.${fetched_at ? ` Snapshot from ${when(fetched_at)} TCT.` : ''}`)}
    <div class="stats">
      <div class="stat"><b>${fmt(rows.length)}</b><span>Members</span></div>
      <div class="stat"><b>${fmt(rows.filter(r => r.act === 'Online').length)}</b><span>Online</span></div>
      <div class="stat"><b>${fmt(rows.filter(r => r.state === 'Hospital').length)}</b><span>In hospital</span></div>
      <div class="stat"><b>${fmt(rows.filter(r => r.state === 'Traveling' || r.state === 'Abroad').length)}</b><span>Traveling / abroad</span></div>
    </div>
    <div class="toolbar">
      <input id="tsQ" placeholder="Name, ID, or faction" style="width:240px" autocomplete="off">
      <select id="tsStatus"><option value="">All statuses</option>${statuses.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>
      <select id="tsAct"><option value="">All activity</option><option value="Online">Online</option><option value="Idle">Idle</option><option value="Offline">Offline</option></select>
      <span id="teamCount" style="color:var(--muted);align-self:center"></span>
    </div>
    <div id="teamTable"></div>`;
      $('#tsQ').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
      $('#tsStatus').addEventListener('change', e => { state.status = e.target.value; render(); });
      $('#tsAct').addEventListener('change', e => { state.act = e.target.value; render(); });
      render();
    };

    pages.settings = async () => {
      const [bankers, thresholds, cfg] = await Promise.all([api('/bankers'), api('/thresholds'), api('/settings')]);
      const fields = [
        ['requests_channel', 'Requests channel ID'], ['bankers_channel', 'Bankers channel ID'], ['log_channel', 'Log channel ID'],
        ['council_role', 'Council role ID'], ['banker_role', 'Banker role ID'], ['keyword', 'Keyword'],
        ['leech_min_attacks', 'Flag below this many attacks'], ['leech_min_requests', 'Flag at this many fulfilled requests'],
      ];
      const keyUrl = 'https://www.torn.com/preferences.php#tab=api?step=addNewKey&user=basic,log,discord,competition&torn=items&logIds=85,112,18,11&title=brainS';
      $('#main').innerHTML = `
    ${head('Settings', 'Manage banker API keys, per-item attack thresholds, and the Discord and Torn IDs the bot uses.')}
    <h2>Bankers</h2>
    <p class="section-desc">Each banker adds their own Torn API key so the poller can read that account's activity log and record treasury transactions. Keys are encrypted with AES-GCM before they are stored, and are never shown again. Remove a banker to stop polling that account.</p>
    <div class="toolbar">
      <a class="primary" href="${esc(keyUrl)}" target="_blank" rel="noopener">Generate a Torn key</a>
      <span style="color: var(--muted); max-width: 560px;">Opens Torn with the right permissions preselected: your activity log plus basic, items, Discord, and competition data. Torn shows you exactly which log categories it will grant before you confirm. Log in, click Create Key, then paste the key below.</span>
    </div>
    ${table([
        { h: 'Name', f: r => esc(r.name) },
        { h: 'ID', f: r => r.torn_id },
        { h: 'Last poll', f: r => r.last_poll_ts ? when(r.last_poll_ts) : '' },
        { h: '', f: r => r.active ? `<button class="quiet warn" data-remove="${r.torn_id}">Remove</button>` : 'removed' },
      ], bankers, `<tr><td colspan="3"><input id="newKey" type="password" autocomplete="off" placeholder="Custom API key (log selection)"></td><td><button class="primary" id="saveKey">Save key</button></td></tr>`)}
    <div class="msg" id="bMsg"></div>
    <section>
      <h2>Attack thresholds</h2>
      <p class="section-desc">Set a minimum attack count per item. When a member requests that item, the bot compares their attacks in the current Torn competition to this number and flags the request if they fall short. Start typing an item name to pick it from the list, set the minimum, and save.</p>
      ${table([
        { h: 'Item', f: r => esc(r.name || r.item_id) },
        { h: 'Minimum attacks', n: 1, f: r => fmt(r.min_attacks) },
        { h: '', f: r => `<button class="quiet warn" data-tremove="${r.item_id}">Remove</button>` },
      ], thresholds, `<tr><td><span class="ac"><input id="tItem" placeholder="Item" autocomplete="off"><div class="ac-list" id="itemList" hidden></div></span></td><td class="n"><input id="tMin" type="number" min="1" style="width:120px"></td><td><button class="primary" id="saveT">Save</button></td></tr>`)}
      <div class="msg" id="tMsg"></div>
    </section>
    <section>
      <h2>Discord and Torn</h2>
      <p class="section-desc">Channel and role IDs the bot posts to, the request keyword, and the attack thresholds used by the Risk page.</p>
      <form class="grid" id="cfgForm">
        ${fields.map(([k, l]) => `<label for="c_${k}">${l}</label><input id="c_${k}" name="${k}" value="${esc(cfg[k])}">`).join('')}
        <span></span><div><button class="primary" type="submit">Save settings</button></div>
      </form>
      <div class="msg" id="cMsg"></div>
    </section>`;

      document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', async () => {
        await api(`/bankers/${b.dataset.remove}`, { method: 'DELETE' }); pages.settings();
      }));
      $('#saveKey').addEventListener('click', async () => {
        try { const r = await api('/bankers', { method: 'POST', body: { key: $('#newKey').value.trim() } }); $('#bMsg').className = 'msg ok'; $('#bMsg').textContent = `Saved ${r.name} [${r.torn_id}]`; setTimeout(pages.settings, 800); }
        catch (e) { $('#bMsg').className = 'msg'; $('#bMsg').textContent = e.message; }
      });

      let items = [], tPick = null, tTimer;
      const tList = $('#itemList');
      $('#tItem').addEventListener('input', e => {
        tPick = null;
        const q = e.target.value.trim();
        clearTimeout(tTimer);
        if (q.length < 2) { tList.hidden = true; return; }
        tTimer = setTimeout(async () => {
          try { items = await api(`/items?q=${encodeURIComponent(q)}`); } catch { return; }
          if (!items.length) { tList.hidden = true; return; }
          tList.innerHTML = items.map(i => `<div data-id="${i.item_id}">${esc(i.name)}</div>`).join('');
          tList.hidden = false;
        }, 150);
      });
      tList.addEventListener('mousedown', e => {
        const d = e.target.closest('[data-id]'); if (!d) return;
        tPick = items.find(i => String(i.item_id) === d.dataset.id);
        $('#tItem').value = tPick.name;
        tList.hidden = true;
      });
      $('#tItem').addEventListener('blur', () => setTimeout(() => { tList.hidden = true; }, 150));
      $('#saveT').addEventListener('click', async () => {
        const name = $('#tItem').value.trim().toLowerCase();
        const it = (tPick && tPick.name.toLowerCase() === name) ? tPick : items.find(i => i.name.toLowerCase() === name);
        if (!it) { $('#tMsg').className = 'msg'; $('#tMsg').textContent = 'Pick an item from the list'; return; }
        await api('/thresholds', { method: 'POST', body: { item_id: it.item_id, min_attacks: Number($('#tMin').value) } });
        pages.settings();
      });
      document.querySelectorAll('[data-tremove]').forEach(b => b.addEventListener('click', async () => {
        await api('/thresholds', { method: 'POST', body: { item_id: Number(b.dataset.tremove), min_attacks: 0 } }); pages.settings();
      }));
      $('#cfgForm').addEventListener('submit', async e => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target).entries());
        try { await api('/settings', { method: 'POST', body }); $('#cMsg').className = 'msg ok'; $('#cMsg').textContent = 'Saved'; }
        catch (err) { $('#cMsg').className = 'msg'; $('#cMsg').textContent = err.message; }
      });
    };

    const txCols = [
      { h: 'When', f: r => when(r.timestamp) },
      { h: 'Kind', f: r => r.kind },
      { h: 'What', f: r => r.type === 'cash' ? money(r.qty) : `${fmt(r.qty)} x ${esc(r.item_name || r.item_id)}` },
      { h: 'Value', n: 1, f: r => money(r.value_at_time) },
      { h: 'Direction', f: r => r.direction },
      { h: 'Player', f: r => `${esc(r.counterparty_name)} [${r.counterparty_id}]` },
      { h: 'Banker', f: r => esc(r.banker_name) },
      { h: 'Message', f: r => esc(r.message) },
    ];
    const reqCols = [
      { h: '#', f: r => r.id },
      { h: 'When', f: r => when(r.created_at) },
      { h: 'Member', f: r => `${esc(r.torn_name)}${r.torn_id ? ` [${r.torn_id}]` : ''}` },
      { h: 'Item', f: reqItem },
      { h: 'Attacks', n: 1, f: r => r.attacks_at_request === null ? '' : fmt(r.attacks_at_request) },
      { h: 'Status', f: r => r.status + (r.decline_reason ? `: ${esc(r.decline_reason)}` : '') },
      { h: 'Banker', f: r => esc(r.banker_name || r.handled_by || '') },
    ];

    pages.search = async () => {
      $('#main').innerHTML = `
    ${head('Search', 'Look up any player or item by name or Torn ID to see their full transaction history, requests, and purchases. Start typing to see suggestions.')}
    <div class="toolbar">
      <span class="ac"><input id="sq" style="width:320px" placeholder="Player or item name, or Torn ID" autofocus autocomplete="off"><div class="ac-list" id="searchList" hidden></div></span>
      <button class="primary" id="sgo">Search</button>
    </div>
    <div id="sres"></div>`;
      let suggestTimer;
      const sList = $('#searchList');
      $('#sq').addEventListener('input', e => {
        const q = e.target.value.trim();
        clearTimeout(suggestTimer);
        if (q.length < 2) { sList.hidden = true; return; }
        suggestTimer = setTimeout(async () => {
          try {
            const s = await api(`/suggest?q=${encodeURIComponent(q)}`);
            if (!s.length) { sList.hidden = true; return; }
            sList.innerHTML = s.map(x => `<div data-q="${esc(x.name)}">${esc(x.name)}<span style="color:var(--muted)"> · ${esc(x.kind)}${x.id ? ' · ' + x.id : ''}</span></div>`).join('');
            sList.hidden = false;
          } catch { }
        }, 150);
      });
      sList.addEventListener('mousedown', e => {
        const d = e.target.closest('[data-q]'); if (!d) return;
        $('#sq').value = d.dataset.q;
        sList.hidden = true;
        go();
      });
      $('#sq').addEventListener('blur', () => setTimeout(() => { sList.hidden = true; }, 150));
      const go = async () => {
        const q = $('#sq').value.trim(); if (!q) return;
        location.hash = '#search';
        const r = await api(`/search?q=${encodeURIComponent(q)}`);
        if (r.type === 'none') { $('#sres').innerHTML = `<div class="msg">No player or item matches "${esc(q)}"</div>`; return; }
        if (r.type === 'player') {
          const mine = r.tx.filter(t => t.counterparty_id === r.torn_id);
          const donated = mine.filter(t => t.kind === 'donation').reduce((s, t) => s + t.value_at_time, 0);
          const received = mine.filter(t => t.kind === 'send').reduce((s, t) => s + t.value_at_time, 0);
          $('#sres').innerHTML = `
        <h2>${esc(r.name || r.torn_id)} [${r.torn_id}]</h2>
        <div class="stats">
          <div class="stat"><b>${money(donated)}</b><span>Donated</span></div>
          <div class="stat"><b>${money(received)}</b><span>Received</span></div>
          <div class="stat"><b>${fmt(r.requests.length)}</b><span>Requests</span></div>
        </div>
        <h2>Transactions</h2>${table(txCols, r.tx.map(t => ({ ...t, _cls: t.kind })))}
        <section><h2>Requests</h2>${table(reqCols, r.requests.map(x => ({ ...x, _cls: x.status })))}</section>`;
        } else {
          $('#sres').innerHTML = `
        <h2>${esc(r.item.name)}</h2>
        <div class="stats">
          <div class="stat"><b>${fmt(r.tx.filter(t => t.kind === 'donation').reduce((s, t) => s + t.qty, 0))}</b><span>Donated</span></div>
          <div class="stat"><b>${fmt(r.purchases.reduce((s, p) => s + p.qty, 0))}</b><span>Purchased</span></div>
          <div class="stat"><b>${fmt(r.tx.filter(t => t.kind === 'send').reduce((s, t) => s + t.qty, 0))}</b><span>Sent out</span></div>
          <div class="stat"><b>${money(r.item.market_value)}</b><span>Market value</span></div>
        </div>
        <h2>Transactions</h2>${table(txCols, r.tx.map(t => ({ ...t, _cls: t.kind })))}
        <section><h2>Purchases</h2>${table([
            { h: 'When', f: p => when(p.timestamp) }, { h: 'Qty', n: 1, f: p => fmt(p.qty) }, { h: 'Cost', n: 1, f: p => money(p.cost) }, { h: 'Source', f: p => p.source }, { h: 'Banker', f: p => esc(p.banker_name) },
          ], r.purchases)}</section>
        <section><h2>Requests</h2>${table(reqCols, r.requests.map(x => ({ ...x, _cls: x.status })))}</section>`;
        }
      };
      $('#sgo').addEventListener('click', go);
      $('#sq').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    };

    pages.risk = async () => {
      $('#main').innerHTML = `${head('Risk', 'Members who may be leeching: they have fulfilled requests but low attack activity relative to what they have received. Each row lists why it was flagged. Click a name to see their full history.')}<div id="riskTable"></div>`;
      const r = await api('/risk');
      $('#riskTable').innerHTML = table([
        { h: 'Member', f: x => `<a href="#search" data-q="${x.torn_id}">${esc(x.torn_name)} [${x.torn_id}]</a>` },
        { h: 'Why', f: x => (x.reasons && x.reasons.length) ? `<span class="warn">${x.reasons.map(esc).join('<br>')}</span>` : '' },
        { h: 'Attacks', n: 1, f: x => x.attacks === null ? '' : `<span class="warn">${fmt(x.attacks)}</span>` },
        { h: 'Score', n: 1, f: x => x.score === null ? '' : fmt(x.score) },
        { h: 'Fulfilled', n: 1, f: x => fmt(x.fulfilled) },
        { h: 'Declined', n: 1, f: x => fmt(x.declined) },
        { h: 'Received', n: 1, f: x => money(x.value_received) },
        { h: 'Donated', n: 1, f: x => money(x.value_donated) },
        { h: 'Per attack', n: 1, f: x => x.value_per_attack === null ? '' : money(x.value_per_attack) },
        { h: 'Last request', f: x => when(x.last_request) },
      ], r.flagged);
      $('#riskTable').querySelectorAll('[data-q]').forEach(a => a.addEventListener('click', async e => {
        e.preventDefault(); await pages.search(); $('#sq').value = a.dataset.q; $('#sgo').click();
        document.querySelectorAll('nav a').forEach(n => n.classList.toggle('active', n.dataset.page === 'search'));
      }));
    };

    (async () => {
      try { await api('/dashboard'); showApp(); } catch { showLogin(); }
    })();
  </script>
</body>

</html>
